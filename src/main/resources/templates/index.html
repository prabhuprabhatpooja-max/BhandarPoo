<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pure Puja Essentials')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <!-- Hero -->
    <section class="hero">
        <div class="container hero-inner">
            <div class="hero-text">
                <span class="eyebrow">Welcome to Prabhu Prabhat Pooja World</span>
                <h1>Pure essentials for your daily puja</h1>
                <p>Prabhu Prabhat brings you pure, quality puja essentials for every prayer at home and in the
                    mandir, packed with care and delivered to your door.</p>
                <div class="hero-actions">
                    <a th:href="@{/products}" class="btn btn-primary">Shop Products</a>
                </div>
            </div>
            <div class="hero-art" aria-hidden="true">
                <div class="hero-circle"><span>🪔</span></div>
            </div>
        </div>
    </section>

    <!-- Products -->
    <section class="section section-tinted">
        <div class="container">
            <div class="section-heading">
                <h2>Our Products</h2>
                <div class="divider"><span>❖</span></div>
            </div>
            <div class="product-grid">
                <th:block th:each="p : ${products}">
                    <div th:replace="~{fragments/layout :: product-card(${p})}"></div>
                </th:block>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
