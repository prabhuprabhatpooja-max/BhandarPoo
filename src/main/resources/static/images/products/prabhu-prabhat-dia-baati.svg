<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="1" stop-color="#f8deb6"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f2424"/>
      <stop offset="1" stop-color="#5e1515"/>
    </linearGradient>
    <linearGradient id="diya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9772b"/>
      <stop offset="1" stop-color="#8a3a10"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#fff6a8"/>
      <stop offset="0.5" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#f06414"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <!-- One round cotton wick (gol baati): flat disc with a twisted tip -->
    <g id="wick">
      <ellipse cx="0" cy="6" rx="13" ry="5" fill="#ffffff" stroke="#e3ddd2" stroke-width="1"/>
      <path d="M-5,5 Q0,-16 0,-18 Q0,-16 5,5 Z" fill="#fbf8f2" stroke="#e3ddd2" stroke-width="1"/>
    </g>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="266" rx="150" ry="12" fill="#7a1f1f" opacity="0.12"/>

  <!-- Pack -->
  <rect x="96" y="44" width="164" height="200" rx="10" fill="url(#pack)"/>
  <rect x="104" y="52" width="148" height="184" rx="7" fill="none" stroke="#e8c15a" stroke-width="1.5"/>
  <circle cx="178" cy="78" r="15" fill="#e8701a" stroke="#e8c15a" stroke-width="2"/>
  <text x="178" y="85" text-anchor="middle" font-family="serif" font-size="19" fill="#fff">ॐ</text>
  <text x="178" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#fff" letter-spacing="0.5">PRABHU PRABHAT</text>
  <text x="178" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#e8c15a">Dia Baati</text>

  <!-- Window showing wicks -->
  <rect x="116" y="146" width="124" height="56" rx="6" fill="#fff8ee"/>
  <use href="#wick" x="136" y="178"/>
  <use href="#wick" x="164" y="182"/>
  <use href="#wick" x="192" y="178"/>
  <use href="#wick" x="220" y="182"/>
  <use href="#wick" x="150" y="194"/>
  <use href="#wick" x="206" y="194"/>

  <rect x="140" y="212" width="76" height="18" rx="9" fill="#e8701a"/>
  <text x="178" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">100 pcs</text>

  <!-- Lit diya beside the pack -->
  <circle cx="318" cy="196" r="44" fill="url(#glow)"/>
  <path d="M312,206 Q318,170 318,164 Q322,176 326,190 Q330,204 318,208 Z" fill="url(#flame)"/>
  <path d="M276,212 Q318,206 360,212 Q352,248 318,250 Q284,248 276,212 Z" fill="url(#diya)"/>
  <ellipse cx="318" cy="212" rx="42" ry="7" fill="#f2a24d"/>
  <ellipse cx="318" cy="212" rx="34" ry="4.5" fill="#c9771f"/>

  <!-- Loose wicks in front -->
  <use href="#wick" x="70" y="246"/>
  <use href="#wick" x="94" y="254"/>
</svg>
