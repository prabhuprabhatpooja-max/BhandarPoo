<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="1" stop-color="#f8deb6"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8701a"/>
      <stop offset="1" stop-color="#b8480a"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f2a12"/>
      <stop offset="1" stop-color="#6e1d0e"/>
    </linearGradient>
    <linearGradient id="tablet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9ee"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="262" rx="130" ry="14" fill="#7a1f1f" opacity="0.12"/>

  <!-- Box: top, side, front -->
  <polygon points="130,58 250,58 278,40 158,40" fill="#f49a4c"/>
  <polygon points="250,58 278,40 278,232 250,250" fill="url(#side)"/>
  <rect x="130" y="58" width="120" height="192" fill="url(#front)"/>

  <!-- Front label -->
  <rect x="138" y="66" width="104" height="176" rx="4" fill="none" stroke="#f6c76b" stroke-width="1.5"/>
  <circle cx="190" cy="92" r="16" fill="#7a1f1f" stroke="#f6c76b" stroke-width="2"/>
  <text x="190" y="99" text-anchor="middle" font-family="serif" font-size="20" fill="#f6c76b">ॐ</text>
  <text x="190" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#fff">PRABHU</text>
  <text x="190" y="143" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#fff">PRABHAT</text>
  <rect x="146" y="152" width="88" height="40" rx="3" fill="#fff8ee"/>
  <text x="190" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#b8480a">100% PURE</text>
  <text x="190" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7a1f1f">CAMPHOR</text>
  <text x="190" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fde6c4">Kapoor</text>
  <rect x="164" y="216" width="52" height="18" rx="9" fill="#7a1f1f"/>
  <text x="190" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">50 gm</text>

  <!-- Side label -->
  <text x="266" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f6c76b"
        transform="rotate(-90 266 150)">PURE CAMPHOR</text>

  <!-- Camphor tablets in front -->
  <g stroke="#cfd5dd" stroke-width="1">
    <rect x="72" y="214" width="34" height="34" rx="6" fill="url(#tablet)" transform="rotate(-12 89 231)"/>
    <rect x="96" y="228" width="30" height="30" rx="6" fill="url(#tablet)" transform="rotate(8 111 243)"/>
    <rect x="290" y="224" width="32" height="32" rx="6" fill="url(#tablet)" transform="rotate(14 306 240)"/>
    <rect x="316" y="236" width="26" height="26" rx="5" fill="url(#tablet)" transform="rotate(-6 329 249)"/>
  </g>
</svg>
